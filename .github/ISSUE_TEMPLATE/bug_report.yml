name: 问题报告
description: 报告桥接问题，请先去掉个人数据和凭据。
body:
  - type: input
    id: versions
    attributes:
      label: 软件版本
      description: Windows、桥接、OBS 和伴侣的版本，以及是否使用 README 中的固定布局。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 复现步骤及预期、实际结果
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 脱敏状态或日志片段
      description: 不要提交账号、Cookie、令牌、平台推流凭据、录播、内存转储或运行 manifest。
  - type: checkboxes
    id: privacy
    attributes:
      label: 上传检查
      options:
        - label: 我已去掉个人数据和实际凭据。
          required: true
