worker_processes 1;
worker_shutdown_timeout 5s;
error_log logs/error.log notice;
pid logs/bridge-nginx.pid;

events {
    worker_connections 256;
}

rtmp {
    server {
        listen 127.0.0.1:19360;
        chunk_size 4096;
        out_queue 4096;
        application obs {
            live on;
            record off;
            gop_cache on;
            allow publish 127.0.0.1;
            deny publish all;
            allow play 127.0.0.1;
            deny play all;
        }
    }
}

http {
    access_log off;
    server {
        listen 127.0.0.1:18081;
        server_name localhost;
        location /live {
            flv_live on;
            chunked_transfer_encoding on;
        }
        location = /health {
            default_type text/plain;
            return 200 "local-obs-bridge\n";
        }
        location = /stat {
            rtmp_stat all;
            rtmp_stat_format json;
        }
        location / {
            return 404;
        }
    }
}
